name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public_tree.py
  muse-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the tested upstream SDK commit
        run: python -m pip install 'musegadget @ git+https://github.com/facebookincubator/muse-gadget-sdk.git@b139b45064b4dcecf7bfe97e75bc7f99c10c28b6#subdirectory=linux'
      - run: PYTHONPATH=src python -c 'import muse_service'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public_tree.py
