[Service]
ExecStart=
ExecStart=/opt/musegadget/venv/bin/python /opt/kindle-muse-bridge/src/muse_service.py
Environment=MUSEGADGET_RUN_AS=kindle-muse
Environment="KINDLE_MUSE_DISPLAY_NAME=Kindle Muse Reader"
Environment=KINDLE_MUSE_PUBLISH_SOCKET=/run/kindle-muse-bridge/publish.sock
UMask=0077
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ProtectKernelTunables=true
ProtectControlGroups=true
ReadWritePaths=/var/lib/musegadget /run/musegadget
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
